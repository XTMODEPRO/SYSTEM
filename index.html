        function renderLanguageList(filterText = '') {
            const langListEl = document.getElementById('langList');
            langListEl.innerHTML = '';
            for (const [code, data] of Object.entries(translations)) {
                if (data.name.toLowerCase().includes(filterText.toLowerCase()) || code.toLowerCase().includes(filterText.toLowerCase())) {
                    const btn = document.createElement('button');
                    btn.className = 'lang-option';
                    btn.onclick = () => changeLanguage(code);
                    btn.innerHTML = `<span>${data.name}</span> <span style="font-size:11px; opacity:0.6;">${code.toUpperCase()}</span>`;
                    langListEl.appendChild(btn);
                }
            }
        }

        function getDynamicGreeting(lang) {
            const hour = new Date().getHours();
            const t = translations[lang] || translations['id'];
            let timeWord = t.night;

            if (hour >= 4 && hour < 11) timeWord = t.morning;
            else if (hour >= 11 && hour < 15) timeWord = t.afternoon;
            else if (hour >= 15 && hour < 18) timeWord = t.evening;

            return `${timeWord}${t.welcomeSuffix}`;
        }

        function detectUserLanguage() {
            const savedLang = localStorage.getItem('xt_mod_lang');
            if (savedLang && translations[savedLang]) return savedLang;
            return 'id';
        }

        let currentLang = detectUserLanguage();

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('xt_mod_lang', lang);
            const t = translations[lang] || translations['id'];

            document.getElementById('currentLangLabel').innerText = lang.toUpperCase();
            document.getElementById('searchInput').placeholder = t.searchPlace;
            document.getElementById('greetingTitle').innerText = getDynamicGreeting(lang);
            document.getElementById('greetingDesc').innerText = t.bannerSub;
            document.getElementById('footerText').innerHTML = t.footerText;
            document.getElementById('loadingText').innerText = t.loadingText;

            resetAndRenderMods();
        }

        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');
        const langSearchInput = document.getElementById('langSearchInput');

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('active');
            if(langDropdown.classList.contains('active')) langSearchInput.focus();
        });

        langSearchInput.addEventListener('input', (e) => renderLanguageList(e.target.value));
        window.addEventListener('click', () => langDropdown.classList.remove('active'));

        function changeLanguage(lang) {
            applyLanguage(lang);
            langDropdown.classList.remove('active');
        }

        async function loadDatabase() {
            try {
                const response = await fetch('database.json');
                allMods = await response.json();
                filteredMods = [...allMods];
                resetAndRenderMods();
            } catch (error) {
                console.error('Gagal memuat database:', error);
                const t = translations[currentLang] || translations['id'];
                document.getElementById('appGrid').innerHTML = `<p style="color:red;">${t.failLoad}</p>`;
            }
        }

        function resetAndRenderMods() {
            currentPage = 1;
            document.getElementById('appGrid').innerHTML = '';
            renderNextBatch();
        }

        function renderNextBatch() {
            const appGrid = document.getElementById('appGrid');
            const t = translations[currentLang] || translations['id'];
            const trigger = document.getElementById('infiniteScrollTrigger');

            if (filteredMods.length === 0) {
                appGrid.innerHTML = `<p style="color:var(--text-muted); font-size: 14px;">${t.noData}</p>`;
                trigger.style.display = 'none';
                return;
            }

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const batch = filteredMods.slice(start, end);

            batch.forEach(mod => {
                appGrid.innerHTML += `
                    <div class="app-card">
                        <div class="card-top">
                            <img src="${mod.icon}" alt="${mod.name}" loading="lazy" width="64" height="64" decoding="async">
                            <div class="app-info">
                                <h3>${mod.name}</h3>
                                <span class="category-tag">${mod.category} • v${mod.version}</span>
                                <div class="meta-badges">
                                    <span class="badge">${mod.size}</span>
                                    <span class="badge badge-mod">MOD</span>
                                </div>
                            </div>
                        </div>
                        <div class="features-box">${mod.features}</div>
                        <a href="${mod.download_url}" class="download-btn">
                            <i class="fa-solid fa-download"></i> ${t.downloadBtn}
                        </a>
                    </div>
                `;
            });

            if (end < filteredMods.length) {
                trigger.style.display = 'flex';
            } else {
                trigger.style.display = 'none';
            }
            
            isLoading = false;
        }

        function setupInfiniteScroll() {
            const trigger = document.getElementById('infiniteScrollTrigger');
            
            const observer = new IntersectionObserver((entries) => {
                const firstEntry = entries[0];
                if (firstEntry.isIntersecting && !isLoading) {
                    const start = currentPage * itemsPerPage;
                    if (start < filteredMods.length) {
                        isLoading = true;
                        currentPage++;
                        setTimeout(() => {
                            renderNextBatch();
                        }, 300);
                    }
                }
            }, {
                root: null,
                rootMargin: '150px',
                threshold: 0.1
            });

            observer.observe(trigger);
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();
            filteredMods = allMods.filter(mod => 
                mod.name.toLowerCase().includes(keyword) || 
                mod.features.toLowerCase().includes(keyword) ||
                mod.category.toLowerCase().includes(keyword)
            );
            resetAndRenderMods();
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderLanguageList();
            applyLanguage(currentLang);
            loadDatabase();
            setupInfiniteScroll();
        });
    </script>
</body>
