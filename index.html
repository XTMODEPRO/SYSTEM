<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTMODEPRO - Database Mod APK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #07090e;
            --bg-secondary: #0e121d;
            --bg-card: #131826;
            --bg-card-hover: #1b2235;
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.25);
            --pink-accent: #4facfe;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --border: #1e293b;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* Mengatur agar body menjadi flex layout full tinggi layar */
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 92%;
            max-width: 1240px;
            margin: 0 auto;
        }

        header {
            background-color: rgba(14, 18, 29, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo a {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--accent);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .logo span {
            background: linear-gradient(135deg, var(--accent), var(--pink-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box {
            display: flex;
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 12px 18px;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        .search-box button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0 18px;
            cursor: pointer;
        }

        .greeting-banner {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 28px;
            margin: 25px 0 20px 0;
            position: relative;
            overflow: hidden;
        }

        .greeting-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent), var(--pink-accent));
        }

        .greeting-text h2 {
            font-size: 19px;
            color: #fff;
            font-weight: 700;
        }

        .greeting-text p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Memaksa area main mengisi sisa ruang kosong agar footer terdorong ke bawah secara rapi */
        main {
            flex: 1;
            padding-bottom: 40px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .section-title i {
            color: var(--accent);
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .app-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .app-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .app-card img {
            width: 68px;
            height: 68px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid var(--border);
            background: #000;
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-info h3 {
            font-size: 15px;
            color: #fff;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .category-tag {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .meta-badges {
            display: flex;
            gap: 6px;
        }

        .badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .badge.safe {
            color: var(--success);
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .features-box {
            font-size: 12px;
            color: #cbd5e1;
            background: rgba(7, 9, 14, 0.6);
            padding: 10px 12px;
            border-radius: 10px;
            border-left: 3px solid var(--accent);
            line-height: 1.4;
        }

        .download-btn {
            background: linear-gradient(135deg, var(--accent) 0%, var(--pink-accent) 100%);
            color: #07090e;
            text-align: center;
            padding: 11px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            opacity: 0.9;
        }

        footer {
            background-color: var(--bg-secondary);
            color: var(--text-muted);
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            font-size: 13px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="container navbar">
            <div class="logo">
                <a href="#">
                    <img src="https://files.catbox.moe/jnelom.png" alt="Logo" class="logo-icon">
                    <span>XTMODEPRO</span>
                </a>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari mod...">
                <button><i class="fa-solid fa-search"></i></button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="greeting-banner">
            <div class="greeting-text">
                <h2>Selamat Datang di XTMODEPRO! 🚀</h2>
                <p>Database mod game dan aplikasi terlengkap dan terupdate.</p>
            </div>
        </div>
        <div class="app-grid" id="appGrid">
            <!-- Data akan otomatis dimuat dari database.json -->
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 XTMODEPRO. All rights reserved.</p>
        </div>
    </footer>

    <script>
        let allMods = [];

        async function loadDatabase() {
            try {
                const response = await fetch('database.json');
                allMods = await response.json();
                displayMods(allMods);
            } catch (error) {
                console.error('Gagal memuat database:', error);
                document.getElementById('appGrid').innerHTML = '<p style="color:red;">Gagal memuat data dari database.json</p>';
            }
        }

        function displayMods(mods) {
            const appGrid = document.getElementById('appGrid');
            appGrid.innerHTML = '';

            if (mods.length === 0) {
                appGrid.innerHTML = '<p style="color:var(--text-muted);">Tidak ada mod ditemukan.</p>';
                return;
            }

            mods.forEach(mod => {
                appGrid.innerHTML += `
                    <div class="app-card" data-name="${mod.name.toLowerCase()}">
                        <div class="card-top">
                            <img src="${mod.icon}" alt="App Icon">
                            <div class="app-info">
                                <h3>${mod.name}</h3>
                                <span class="category-tag">${mod.category} • ${mod.version}</span>
                                <div class="meta-badges">
                                    <span class="badge">${mod.size}</span>
                                    <span class="badge safe"><i class="fa-solid fa-shield-halved"></i> Aman</span>
                                </div>
                            </div>
                        </div>
                        <div class="features-box">${mod.features}</div>
                        <a href="${mod.download_url}" class="download-btn">
                            <i class="fa-solid fa-download"></i> Unduh APK
                        </a>
                    </div>
                `;
            });
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            const filtered = allMods.filter(mod => 
                mod.name.toLowerCase().includes(keyword) || 
                mod.features.toLowerCase().includes(keyword)
            );
            displayMods(filtered);
        });

        window.addEventListener('DOMContentLoaded', loadDatabase);
    </script>
</body>
</html>
