            --bg-secondary: #131b2e;
            --bg-card: #182238;
            --bg-card-hover: #1f2c48;
            --accent: #00f2fe;
            --accent-green: #10b981;

            --text-main: #f8fafc;

            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 92%;
            max-width: 1240px;
            margin: 0 auto;
        }

        /* HEADER & NAVBAR */
        header {
            background-color: rgba(19, 27, 46, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo a {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .logo span {
            background: linear-gradient(135deg, var(--accent), #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            justify-content: flex-end;
        }

        .search-box {
            display: flex;
            background: var(--bg-primary);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 360px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 10px 16px;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 13px;
        }

        .search-box button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0 16px;
            cursor: pointer;
        }

        .lang-selector-container {
            position: relative;
        }

        .lang-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 10px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 280px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 1001;
            overflow: hidden;
        }

        .lang-dropdown.active {
            display: flex;
        }

        .lang-search-box {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .lang-search-box input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
        }

        .lang-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .lang-option {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 15px;
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lang-option:hover {
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent);
        }

        /* HERO BANNER */
        .greeting-banner {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.08) 0%, rgba(19, 27, 46, 0.8) 100%);

            border-radius: 20px;

        .greeting-text h2 {

        .greeting-text p {

        main {

        }

        /* MOD CARDS GRID */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .app-card {
            background: var(--bg-card);

            background: var(--bg-card-hover);
            border-color: rgba(0, 242, 254, 0.4);

            align-items: center;

            border-radius: 14px;
            object-fit: cover;
            border: 1px solid var(--border);
            background: #07090e;
            flex-shrink: 0;

        .app-info {

            color: var(--text-muted);

            text-align: center;
            padding: 10px;

            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            justify-content: center;

        .download-btn:hover {

            border-radius: 25px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;

        .load-more-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

            background-color: var(--bg-secondary);
            color: var(--text-muted);
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            font-size: 13px;
            margin-top: auto;
        }
    </style>
</head>

            vi: { name: "Tiếng Việt (Vietnamese)", searchPlace: "Tìm kiếm mod...", bannerSub: "Cơ sở dữ liệu mod trò chơi và ứng dụng hoàn chỉnh và cập nhật nhất.", downloadBtn: "Tải xuống APK", footerText: "&copy; 2026 XTMODEPRO. Mọi quyền được bảo lưu.", morning: "Chào buổi sáng", afternoon: "Chào buổi chiều", evening: "Chào buổi tối", night: "Chúc ngủ ngon", welcomeSuffix: " tại XTMODEPRO! 🚀", noData: "Không tìm thấy mod nào.", failLoad: "Không thể tải dữ liệu từ database.json", loadMore: "Tải thêm" }
        };

        function renderLanguageList(filterText = '') {
            const langListEl = document.getElementById('langList');
            langListEl.innerHTML = '';

            for (const [code, data] of Object.entries(translations)) {
                if (data.name.toLowerCase().includes(filterText.toLowerCase()) || code.toLowerCase().includes(filterText.toLowerCase())) {
                    const btn = document.createElement('button');
                    btn.className = 'lang-option';
                    btn.onclick = () => changeLanguage(code);
                    btn.innerHTML = `<span>${data.name}</span> <span style="font-size:11px; opacity:0.6;">${code.toUpperCase()}</span>`;
                    langListEl.appendChild(btn);
                }
            }
        }

        function getDynamicGreeting(lang) {
            const hour = new Date().getHours();
            const t = translations[lang] || translations['id'];
            let timeWord = t.night;

            if (hour >= 4 && hour < 11) timeWord = t.morning;
            else if (hour >= 11 && hour < 15) timeWord = t.afternoon;
            else if (hour >= 15 && hour < 18) timeWord = t.evening;

            return `${timeWord}${t.welcomeSuffix}`;
        }

        function detectUserLanguage() {
            const savedLang = localStorage.getItem('xt_mod_lang');
            if (savedLang && translations[savedLang]) return savedLang;

            const browserLang = (navigator.language || navigator.userLanguage || 'id').toLowerCase();
            for (let key in translations) {
                if (browserLang.startsWith(key)) return key;
            }

            return 'id';
        }

        let currentLang = detectUserLanguage();

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('xt_mod_lang', lang);
            const t = translations[lang] || translations['id'];

            document.getElementById('currentLangLabel').innerText = lang.toUpperCase();
            document.getElementById('searchInput').placeholder = t.searchPlace;
            document.getElementById('greetingTitle').innerText = getDynamicGreeting(lang);
            document.getElementById('greetingDesc').innerText = t.bannerSub;
            document.getElementById('footerText').innerHTML = t.footerText;
            document.getElementById('loadMoreBtn').innerText = t.loadMore || "Load More";

            resetAndRenderMods();
        }

        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');
        const langSearchInput = document.getElementById('langSearchInput');

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('active');
            if(langDropdown.classList.contains('active')) langSearchInput.focus();
        });

        langSearchInput.addEventListener('input', (e) => renderLanguageList(e.target.value));
        window.addEventListener('click', () => langDropdown.classList.remove('active'));

        function changeLanguage(lang) {
            applyLanguage(lang);
            langDropdown.classList.remove('active');
        }

        async function loadDatabase() {
            try {
                const response = await fetch('database.json');
                allMods = await response.json();
                filteredMods = [...allMods];
                resetAndRenderMods();
            } catch (error) {
                console.error('Gagal memuat database:', error);
                const t = translations[currentLang] || translations['id'];
                document.getElementById('appGrid').innerHTML = `<p style="color:red;">${t.failLoad}</p>`;
            }
        }

        function resetAndRenderMods() {
            currentPage = 1;
            document.getElementById('appGrid').innerHTML = '';
            renderNextBatch();
        }

        function renderNextBatch() {
            const appGrid = document.getElementById('appGrid');
            const t = translations[currentLang] || translations['id'];
            
            if (filteredMods.length === 0) {
                appGrid.innerHTML = `<p style="color:var(--text-muted); font-size: 14px;">${t.noData}</p>`;
                document.getElementById('loadMoreContainer').style.display = 'none';
                return;
            }

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const batch = filteredMods.slice(start, end);

            batch.forEach(mod => {
                appGrid.innerHTML += `
                    <div class="app-card">
                        <div class="card-top">
                            <!-- Memuat ikon asli dengan lazy-loading -->
                            <img src="${mod.icon}" alt="${mod.name}" loading="lazy" width="64" height="64">
                            <div class="app-info">
                                <h3>${mod.name}</h3>
                                <span class="category-tag">${mod.category} • v${mod.version}</span>
                                <div class="meta-badges">
                                    <span class="badge">${mod.size}</span>
                                    <span class="badge" style="color:#10b981; border-color:rgba(16,185,129,0.2);">MOD</span>
                                </div>
                            </div>
                        </div>
                        <div class="features-box">${mod.features}</div>
                        <a href="${mod.download_url}" class="download-btn">
                            <i class="fa-solid fa-download"></i> ${t.downloadBtn}
                        </a>
                    </div>
                `;
            });

            const loadMoreContainer = document.getElementById('loadMoreContainer');
            if (end < filteredMods.length) {
                loadMoreContainer.style.display = 'block';
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }

        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            currentPage++;
            renderNextBatch();
        });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();
            filteredMods = allMods.filter(mod => 
                mod.name.toLowerCase().includes(keyword) || 
                mod.features.toLowerCase().includes(keyword) ||
                mod.category.toLowerCase().includes(keyword)
            );
            resetAndRenderMods();
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderLanguageList();
            applyLanguage(currentLang);
            loadDatabase();
        });
    </script>
</body>
</html>
