<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTMODEPRO - Database Mod APK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #070a12;
            --bg-secondary: #0d1220;
            --bg-card: rgba(18, 25, 41, 0.7);
            --bg-card-hover: rgba(28, 38, 61, 0.85);
            --accent: #00f2fe;
            --accent-green: #10b981;
            --accent-glow: rgba(0, 242, 254, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 242, 254, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            width: 92%;
            max-width: 1240px;
            margin: 0 auto;
        }

        /* HEADER & NAVBAR */
        header {
            background-color: rgba(7, 10, 18, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo a {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            object-fit: cover;
            border: 1.5px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .logo span {
            background: linear-gradient(135deg, var(--accent), #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            justify-content: flex-end;
        }

        .search-box {
            display: flex;
            background: var(--bg-secondary);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 360px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 10px 16px;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 13px;
        }

        .search-box button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0 16px;
            cursor: pointer;
        }

        .lang-selector-container {
            position: relative;
        }

        .lang-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            border-color: var(--accent);
        }

        .lang-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 10px);
            background: #0d1322;
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 280px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            z-index: 1001;
            overflow: hidden;
        }

        .lang-dropdown.active {
            display: flex;
        }

        .lang-search-box {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-primary);
        }

        .lang-search-box input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
        }

        .lang-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .lang-option {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 15px;
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lang-option:hover {
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent);
        }

        /* HERO BANNER */
        .greeting-banner {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.08) 0%, rgba(13, 18, 32, 0.8) 100%);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 30px;
            margin: 25px 0;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .greeting-text h2 {
            font-size: 20px;
            color: #fff;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .greeting-text p {
            font-size: 13px;
            color: var(--text-muted);
        }

        main {
            flex: 1;
            padding-bottom: 40px;
        }

        /* MOD CARDS GRID */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .app-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 14px;
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .app-card:hover {
            transform: translateY(-6px);
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 254, 0.15);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-card img {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid var(--border);
            background: #000;
            flex-shrink: 0;
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-info h3 {
            font-size: 15px;
            color: #fff;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .category-tag {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
        }

        .meta-badges {
            display: flex;
            gap: 6px;
        }

        .badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 242, 254, 0.2);
            font-weight: 600;
        }

        .badge-mod {
            color: var(--accent-green);
            border-color: rgba(16, 185, 129, 0.2);
            background: rgba(16, 185, 129, 0.05);
        }

        .features-box {
            font-size: 12px;
            color: #cbd5e1;
            background: rgba(7, 10, 18, 0.6);
            padding: 10px 12px;
            border-radius: 12px;
            border-left: 3px solid var(--accent-green);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .download-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #00c6ff 100%);
            color: #070a12;
            text-align: center;
            padding: 11px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }

        .download-btn:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        /* INFINITE SCROLL LOADER */
        .loading-sentinel {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            background-color: var(--bg-secondary);
            color: var(--text-muted);
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            font-size: 13px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="container navbar">
            <div class="logo">
                <a href="#">
                    <img src="https://files.catbox.moe/jnelom.png" alt="Logo" class="logo-icon" loading="lazy">
                    <span>XTMODEPRO</span>
                </a>
            </div>
            <div class="nav-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Cari mod...">
                    <button><i class="fa-solid fa-search"></i></button>
                </div>
                <div class="lang-selector-container">
                    <button class="lang-btn" id="langBtn">
                        <i class="fa-solid fa-globe"></i> <span id="currentLangLabel">ID</span> <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
                    </button>
                    <div class="lang-dropdown" id="langDropdown">
                        <div class="lang-search-box">
                            <input type="text" id="langSearchInput" placeholder="Cari semua bahasa...">
                        </div>
                        <div class="lang-list" id="langList"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="greeting-banner">
            <div class="greeting-text">
                <h2 id="greetingTitle">Selamat Datang di XTMODEPRO! 🚀</h2>
                <p id="greetingDesc">Database mod game dan aplikasi terlengkap dan terupdate.</p>
            </div>
        </div>
        
        <div class="app-grid" id="appGrid"></div>

        <!-- Element Pemicu Infinite Scroll -->
        <div id="infiniteScrollTrigger" class="loading-sentinel" style="display: none;">
            <div class="spinner"></div> Memuat data...
        </div>
    </main>

    <footer>
        <div class="container">
            <p id="footerText">&copy; 2026 XTMODEPRO. All rights reserved.</p>
        </div>
    </footer>

    <script>
        let allMods = [];
        let filteredMods = [];
        let currentPage = 1;
        const itemsPerPage = 12; // Render bertahap 12 item
        let isLoading = false;

        const translations = {
            id: { name: "Bahasa Indonesia", searchPlace: "Cari mod...", bannerSub: "Database mod game dan aplikasi terlengkap dan terupdate.", downloadBtn: "Unduh APK", footerText: "&copy; 2026 XTMODEPRO. All rights reserved.", morning: "Selamat Pagi", afternoon: "Selamat Siang", evening: "Selamat Sore", night: "Selamat Malam", welcomeSuffix: " di XTMODEPRO! 🚀", noData: "Tidak ada mod ditemukan.", failLoad: "Gagal memuat data dari database.json", loadingText: "Memuat data..." },
            en: { name: "English", searchPlace: "Search mod...", bannerSub: "Complete and updated game and application mod database.", downloadBtn: "Download APK", footerText: "&copy; 2026 XTMODEPRO. All rights reserved.", morning: "Good Morning", afternoon: "Good Afternoon", evening: "Good Evening", night: "Good Night", welcomeSuffix: " to XTMODEPRO! 🚀", noData: "No mods found.", failLoad: "Failed to load data from database.json", loadingText: "Loading data..." }
        };

        function renderLanguageList(filterText = '') {
            const langListEl = document.getElementById('langList');
            langListEl.innerHTML = '';
            for (const [code, data] of Object.entries(translations)) {
                if (data.name.toLowerCase().includes(filterText.toLowerCase()) || code.toLowerCase().includes(filterText.toLowerCase())) {
                    const btn = document.createElement('button');
                    btn.className = 'lang-option';
                    btn.onclick = () => changeLanguage(code);
                    btn.innerHTML = `<span>${data.name}</span> <span style="font-size:11px; opacity:0.6;">${code.toUpperCase()}</span>`;
                    langListEl.appendChild(btn);
                }
            }
        }

        function getDynamicGreeting(lang) {
            const hour = new Date().getHours();
            const t = translations[lang] || translations['id'];
            let timeWord = t.night;

            if (hour >= 4 && hour < 11) timeWord = t.morning;
            else if (hour >= 11 && hour < 15) timeWord = t.afternoon;
            else if (hour >= 15 && hour < 18) timeWord = t.evening;

            return `${timeWord}${t.welcomeSuffix}`;
        }

        function detectUserLanguage() {
            const savedLang = localStorage.getItem('xt_mod_lang');
            if (savedLang && translations[savedLang]) return savedLang;
            return 'id';
        }

        let currentLang = detectUserLanguage();

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('xt_mod_lang', lang);
            const t = translations[lang] || translations['id'];

            document.getElementById('currentLangLabel').innerText = lang.toUpperCase();
            document.getElementById('searchInput').placeholder = t.searchPlace;
            document.getElementById('greetingTitle').innerText = getDynamicGreeting(lang);
            document.getElementById('greetingDesc').innerText = t.bannerSub;
            document.getElementById('footerText').innerHTML = t.footerText;

            resetAndRenderMods();
        }

        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');
        const langSearchInput = document.getElementById('langSearchInput');

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('active');
            if(langDropdown.classList.contains('active')) langSearchInput.focus();
        });

        langSearchInput.addEventListener('input', (e) => renderLanguageList(e.target.value));
        window.addEventListener('click', () => langDropdown.classList.remove('active'));

        function changeLanguage(lang) {
            applyLanguage(lang);
            langDropdown.classList.remove('active');
        }

        async function loadDatabase() {
            try {
                const response = await fetch('database.json');
                allMods = await response.json();
                filteredMods = [...allMods];
                resetAndRenderMods();
            } catch (error) {
                console.error('Gagal memuat database:', error);
                const t = translations[currentLang] || translations['id'];
                document.getElementById('appGrid').innerHTML = `<p style="color:red;">${t.failLoad}</p>`;
            }
        }

        function resetAndRenderMods() {
            currentPage = 1;
            document.getElementById('appGrid').innerHTML = '';
            renderNextBatch();
        }

        function renderNextBatch() {
            const appGrid = document.getElementById('appGrid');
            const t = translations[currentLang] || translations['id'];
            const trigger = document.getElementById('infiniteScrollTrigger');

            if (filteredMods.length === 0) {
                appGrid.innerHTML = `<p style="color:var(--text-muted); font-size: 14px;">${t.noData}</p>`;
                trigger.style.display = 'none';
                return;
            }

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const batch = filteredMods.slice(start, end);

            batch.forEach(mod => {
                appGrid.innerHTML += `
                    <div class="app-card">
                        <div class="card-top">
                            <img src="${mod.icon}" alt="${mod.name}" loading="lazy" width="64" height="64">
                            <div class="app-info">
                                <h3>${mod.name}</h3>
                                <span class="category-tag">${mod.category} • v${mod.version}</span>
                                <div class="meta-badges">
                                    <span class="badge">${mod.size}</span>
                                    <span class="badge badge-mod">MOD</span>
                                </div>
                            </div>
                        </div>
                        <div class="features-box">${mod.features}</div>
                        <a href="${mod.download_url}" class="download-btn">
                            <i class="fa-solid fa-download"></i> ${t.downloadBtn}
                        </a>
                    </div>
                `;
            });

            // Atur indikator pencapaian akhir data
            if (end < filteredMods.length) {
                trigger.style.display = 'flex';
            } else {
                trigger.style.display = 'none';
            }
            
            isLoading = false;
        }

        // Setup Intersection Observer untuk Infinite Scroll Otomatis
        function setupInfiniteScroll() {
            const trigger = document.getElementById('infiniteScrollTrigger');
            
            const observer = new IntersectionObserver((entries) => {
                const firstEntry = entries[0];
                if (firstEntry.isIntersecting && !isLoading) {
                    const start = currentPage * itemsPerPage;
                    if (start < filteredMods.length) {
                        isLoading = true;
                        currentPage++;
                        setTimeout(() => {
                            renderNextBatch();
                        }, 300); // Penundaan kecil untuk animasi halus
                    }
                }
            }, {
                root: null,
                rootMargin: '150px', // Memuat sebelum pengguna menyentuh paling bawah
                threshold: 0.1
            });

            observer.observe(trigger);
        }

        // Pencarian Realtime
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();
            filteredMods = allMods.filter(mod => 
                mod.name.toLowerCase().includes(keyword) || 
                mod.features.toLowerCase().includes(keyword) ||
                mod.category.toLowerCase().includes(keyword)
            );
            resetAndRenderMods();
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderLanguageList();
            applyLanguage(currentLang);
            loadDatabase();
            setupInfiniteScroll();
        });
    </script>
</body>
</html>
