<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTMODEPRO - MODS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131b2e;
            --bg-card: #182238;
            --bg-card-hover: #1f2c48;
            --accent: #00f2fe;
            --accent-green: #10b981;
            --accent-glow: rgba(0, 242, 254, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 92%;
            max-width: 1240px;
            margin: 0 auto;
        }

        /* HEADER & NAVBAR */
        header {
            background-color: rgba(19, 27, 46, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo a {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .logo span {
            background: linear-gradient(135deg, var(--accent), #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            justify-content: flex-end;
        }

        .search-box {
            display: flex;
            background: var(--bg-primary);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 360px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 10px 16px;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 13px;
        }

        .search-box button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0 16px;
            cursor: pointer;
        }

        .lang-selector-container {
            position: relative;
        }

        .lang-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 10px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 280px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 1001;
            overflow: hidden;
        }

        .lang-dropdown.active {
            display: flex;
        }

        .lang-search-box {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .lang-search-box input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
        }

        .lang-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .lang-option {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 15px;
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lang-option:hover {
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent);
        }

        /* HERO BANNER */
        .greeting-banner {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.08) 0%, rgba(19, 27, 46, 0.8) 100%);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 30px;
            margin: 25px 0;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .greeting-text h2 {
            font-size: 20px;
            color: #fff;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .greeting-text p {
            font-size: 13px;
            color: var(--text-muted);
        }

        main {
            flex: 1;
            padding-bottom: 40px;
        }

        /* MOD CARDS GRID */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .app-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            border: 1px solid var(--border);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .app-card:hover {
            transform: translateY(-5px);
            background: var(--bg-card-hover);
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Gambar terkompres & lazy load */
        .app-card img {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid var(--border);
            background: #07090e;
            flex-shrink: 0;
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-info h3 {
            font-size: 15px;
            color: #fff;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .category-tag {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
        }

        .meta-badges {
            display: flex;
            gap: 6px;
        }

        .badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 242, 254, 0.2);
            font-weight: 600;
        }

        .features-box {
            font-size: 12px;
            color: #cbd5e1;
            background: rgba(11, 15, 25, 0.6);
            padding: 10px 12px;
            border-radius: 10px;
            border-left: 3px solid var(--accent-green);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .download-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #00c6ff 100%);
            color: #0b0f19;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .download-btn:hover {
            opacity: 0.9;
        }

        /* LOAD MORE & LOADER */
        .load-more-container {
            text-align: center;
            margin-top: 30px;
        }

        .load-more-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        footer {
            background-color: var(--bg-secondary);
            color: var(--text-muted);
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            font-size: 13px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="container navbar">
            <div class="logo">
                <a href="#">
                    <img src="https://wsrv.nl/?url=files.catbox.moe/jnelom.png&w=80&q=60" alt="Logo" class="logo-icon">
                    <span>XTMODEPRO</span>
                </a>
            </div>
            <div class="nav-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Cari mod...">
                    <button><i class="fa-solid fa-search"></i></button>
                </div>
                <div class="lang-selector-container">
                    <button class="lang-btn" id="langBtn">
                        <i class="fa-solid fa-globe"></i> <span id="currentLangLabel">ID</span> <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
                    </button>
                    <div class="lang-dropdown" id="langDropdown">
                        <div class="lang-search-box">
                            <input type="text" id="langSearchInput" placeholder="Cari semua bahasa...">
                        </div>
                        <div class="lang-list" id="langList"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="greeting-banner">
            <div class="greeting-text">
                <h2 id="greetingTitle">Selamat Datang di XTMODEPRO! 🚀</h2>
                <p id="greetingDesc">Database mod game dan aplikasi terlengkap dan terupdate.</p>
            </div>
        </div>
        
        <div class="app-grid" id="appGrid"></div>

        <div class="load-more-container" id="loadMoreContainer" style="display: none;">
            <button class="load-more-btn" id="loadMoreBtn">Muat Lebih Banyak</button>
        </div>
    </main>

    <footer>
        <div class="container">
            <p id="footerText">&copy; 2026 XTMODEPRO. All rights reserved.</p>
        </div>
    </footer>

    <script>
        let allMods = [];
        let filteredMods = [];
        let currentPage = 1;
        const itemsPerPage = 12; // Membatasi jumlah data yang di-load dalam satu waktu

        const translations = {
            id: { name: "Bahasa Indonesia", searchPlace: "Cari mod...", bannerSub: "Database mod game dan aplikasi terlengkap dan terupdate.", downloadBtn: "Unduh APK", footerText: "&copy; 2026 XTMODEPRO. All rights reserved.", morning: "Selamat Pagi", afternoon: "Selamat Siang", evening: "Selamat Sore", night: "Selamat Malam", welcomeSuffix: " di XTMODEPRO! 🚀", noData: "Tidak ada mod ditemukan.", failLoad: "Gagal memuat data dari database.json", loadMore: "Muat Lebih Banyak" },
            en: { name: "English", searchPlace: "Search mod...", bannerSub: "Complete and updated game and application mod database.", downloadBtn: "Download APK", footerText: "&copy; 2026 XTMODEPRO. All rights reserved.", morning: "Good Morning", afternoon: "Good Afternoon", evening: "Good Evening", night: "Good Night", welcomeSuffix: " to XTMODEPRO! 🚀", noData: "No mods found.", failLoad: "Failed to load data from database.json", loadMore: "Load More" }
        };

        // Fungsi kompresi URL gambar via wsrv.nl CDN service
        function getLowResImageUrl(originalUrl) {
            if (!originalUrl) return '';
            // Jika gambar adalah data base64 / blob lokal, abaikan
            if (originalUrl.startsWith('data:') || originalUrl.startsWith('blob:')) return originalUrl;
            // Membatasi lebar max 80px & kualitas 50% (Sangat ringan/burik ramah kuota)
            return `https://wsrv.nl/?url=${encodeURIComponent(originalUrl)}&w=80&q=50&output=webp`;
        }

        function renderLanguageList(filterText = '') {
            const langListEl = document.getElementById('langList');
            langListEl.innerHTML = '';
            for (const [code, data] of Object.entries(translations)) {
                if (data.name.toLowerCase().includes(filterText.toLowerCase()) || code.toLowerCase().includes(filterText.toLowerCase())) {
                    const btn = document.createElement('button');
                    btn.className = 'lang-option';
                    btn.onclick = () => changeLanguage(code);
                    btn.innerHTML = `<span>${data.name}</span> <span style="font-size:11px; opacity:0.6;">${code.toUpperCase()}</span>`;
                    langListEl.appendChild(btn);
                }
            }
        }

        function getDynamicGreeting(lang) {
            const hour = new Date().getHours();
            const t = translations[lang] || translations['id'];
            let timeWord = t.night;

            if (hour >= 4 && hour < 11) timeWord = t.morning;
            else if (hour >= 11 && hour < 15) timeWord = t.afternoon;
            else if (hour >= 15 && hour < 18) timeWord = t.evening;

            return `${timeWord}${t.welcomeSuffix}`;
        }

        function detectUserLanguage() {
            const savedLang = localStorage.getItem('xt_mod_lang');
            if (savedLang && translations[savedLang]) return savedLang;
            return 'id';
        }

        let currentLang = detectUserLanguage();

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('xt_mod_lang', lang);
            const t = translations[lang] || translations['id'];

            document.getElementById('currentLangLabel').innerText = lang.toUpperCase();
            document.getElementById('searchInput').placeholder = t.searchPlace;
            document.getElementById('greetingTitle').innerText = getDynamicGreeting(lang);
            document.getElementById('greetingDesc').innerText = t.bannerSub;
            document.getElementById('footerText').innerHTML = t.footerText;
            document.getElementById('loadMoreBtn').innerText = t.loadMore || "Load More";

            resetAndRenderMods();
        }

        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');
        const langSearchInput = document.getElementById('langSearchInput');

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('active');
            if(langDropdown.classList.contains('active')) langSearchInput.focus();
        });

        langSearchInput.addEventListener('input', (e) => renderLanguageList(e.target.value));
        window.addEventListener('click', () => langDropdown.classList.remove('active'));

        function changeLanguage(lang) {
            applyLanguage(lang);
            langDropdown.classList.remove('active');
        }

        async function loadDatabase() {
            try {
                const response = await fetch('database.json');
                allMods = await response.json();
                filteredMods = [...allMods];
                resetAndRenderMods();
            } catch (error) {
                console.error('Gagal memuat database:', error);
                const t = translations[currentLang] || translations['id'];
                document.getElementById('appGrid').innerHTML = `<p style="color:red;">${t.failLoad}</p>`;
            }
        }

        function resetAndRenderMods() {
            currentPage = 1;
            document.getElementById('appGrid').innerHTML = '';
            renderNextBatch();
        }

        // Render data bertahap (Paging)
        function renderNextBatch() {
            const appGrid = document.getElementById('appGrid');
            const t = translations[currentLang] || translations['id'];
            
            if (filteredMods.length === 0) {
                appGrid.innerHTML = `<p style="color:var(--text-muted); font-size: 14px;">${t.noData}</p>`;
                document.getElementById('loadMoreContainer').style.display = 'none';
                return;
            }

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const batch = filteredMods.slice(start, end);

            batch.forEach(mod => {
                // Konversi gambar ke versi ringan + tambahkan loading="lazy"
                const lowResIcon = getLowResImageUrl(mod.icon);

                appGrid.innerHTML += `
                    <div class="app-card">
                        <div class="card-top">
                            <img src="${lowResIcon}" alt="${mod.name}" loading="lazy" width="64" height="64">
                            <div class="app-info">
                                <h3>${mod.name}</h3>
                                <span class="category-tag">${mod.category} • v${mod.version}</span>
                                <div class="meta-badges">
                                    <span class="badge">${mod.size}</span>
                                    <span class="badge" style="color:#10b981; border-color:rgba(16,185,129,0.2);">MOD</span>
                                </div>
                            </div>
                        </div>
                        <div class="features-box">${mod.features}</div>
                        <a href="${mod.download_url}" class="download-btn">
                            <i class="fa-solid fa-download"></i> ${t.downloadBtn}
                        </a>
                    </div>
                `;
            });

            // Tampilkan atau sembunyikan tombol "Load More"
            const loadMoreContainer = document.getElementById('loadMoreContainer');
            if (end < filteredMods.length) {
                loadMoreContainer.style.display = 'block';
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }

        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            currentPage++;
            renderNextBatch();
        });

        // Fitur Pencarian
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();
            filteredMods = allMods.filter(mod => 
                mod.name.toLowerCase().includes(keyword) || 
                mod.features.toLowerCase().includes(keyword) ||
                mod.category.toLowerCase().includes(keyword)
            );
            resetAndRenderMods();
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderLanguageList();
            applyLanguage(currentLang);
            loadDatabase();
        });
    </script>
</body>
</html>
